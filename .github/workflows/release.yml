name: Publish approved CAE tag
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Validate tag and prepare environment
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid version tag' }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match package version' }
          ./scripts/setup.ps1
      - name: Validate and build
        shell: pwsh
        run: ./scripts/release.ps1
      - name: Publish new release only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; refusing to overwrite it' }
          $version = $env:RELEASE_TAG.Substring(1)
          $directory = "dist/$version"
          $notes = "docs/RELEASE_NOTES_$($env:RELEASE_TAG).md"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Version-specific release notes required' }
          gh release create $env:RELEASE_TAG "$directory/CAE-Control-Center.exe" "$directory/CAE-Broker.exe" "$directory/CAE-Console-Client.exe" "$directory/CAE-Desktop-Client.exe" "$directory/codex_api_engine-$version-py3-none-any.whl" "$directory/codex_api_engine-$version.tar.gz" "$directory/SHA256SUMS.json" --repo $env:REPOSITORY --verify-tag --title "CODEX ACCESS ENGINE $($env:RELEASE_TAG)" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
